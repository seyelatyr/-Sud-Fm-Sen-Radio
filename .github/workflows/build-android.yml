name: Build SUD FM Sen Radio

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build test APK and release AAB
        run: gradle :app:assembleDebug :app:bundleRelease --stacktrace
      - name: Verify package and version
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$AAPT" dump badging "$APK" | head -1 | tee /tmp/badging.txt
          grep -q "name='com.newandromo.dev1660662.app2146388'" /tmp/badging.txt
          grep -q "versionCode='1050'" /tmp/badging.txt
          mkdir -p out
          cp "$APK" out/SUD_FM_SEN_RADIO_V2_0_4_TEST.apk
          cp app/build/outputs/bundle/release/app-release.aab out/SUD_FM_SEN_RADIO_V2_0_4_UNSIGNED.aab
          printf '%s\n' \
            'SUD FM Sen Radio 2.0.4' \
            'versionCode 1050' \
            'package com.newandromo.dev1660662.app2146388' \
            'stream https://stream.zeno.fm/8hddc402zbruv' \
            'fix: avoid explicit startForegroundService timeout crash; MediaSessionService starts normally and Media3 promotes playback' \
            'robust live playback: OkHttp no read timeout + reconnect + network callback + health watchdog' \
            'AdMob app ID ca-app-pub-0241595114429536~2076439740' \
            'AdMob banner ca-app-pub-0241595114429536/9623468443' \
            'AdMob interstitial ca-app-pub-0241595114429536/3150095684' > out/BUILD_INFO.txt
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sud-fm-sen-radio-v2.0.4
          path: out/
          retention-days: 30
